name: maxi_pocket
description: "Flutter mobile app for managing fixed expenses, such as subscriptions and financing"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  collection: ^1.19.1
  easy_debounce: ^2.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  get_it: ^9.2.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  logger: ^2.7.0
  riverpod: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-uiscene-migration: true

  assets:
    - assets/images/
    - assets/images/svg/
    - assets/icons/
    - assets/fonts/