name: maxi_pocket
description: "Flutter mobile app for managing fixed expenses, such as subscriptions and financing"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  collection: ^1.19.1
  easy_debounce: ^2.0.3
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  google_fonts: ^8.0.2
  intl: any
  json_annotation: ^4.11.0
  logger: ^2.7.0
  package_info_plus: ^9.0.1
  riverpod: ^3.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.13.1

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-uiscene-migration: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/maxi_pocket_app_image.png"
  adaptive_icon_background: "#FFB3C1"
  adaptive_icon_foreground: "assets/images/maxi_pocket_app_image_foreground.png"
