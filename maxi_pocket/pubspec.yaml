name: maxi_pocket
description: "Flutter mobile app for managing fixed expenses, such as subscriptions and financing"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-uiscene-migration: true

  assets:
    - assets/images/
    - assets/images/svg/
    - assets/icons/
    - assets/fonts/